<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>稳投屏 · 电脑接收端</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--line:#d8dee4;--text:#1f2328;--muted:#57606a;--blue:#185fa5;--green:#0f6e56;--amber:#854f0b;--red:#a32d2d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
header{display:flex;align-items:center;gap:12px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:17px;font-weight:500;margin:0}
.badge{margin-left:auto;padding:4px 12px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.badge.ok{background:#e1f5ee;border-color:#9fe1cb;color:var(--green)}
.badge.warn{background:#faeeda;border-color:#fac775;color:var(--amber)}
.badge.err{background:#fcebeb;border-color:#f7c1c1;color:var(--red)}
main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding:24px 28px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.card h2{font-size:14px;font-weight:500;margin:0 0 14px}
.qr{width:100%;max-width:240px;display:block;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.qr-hint{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 18px}
.field{margin-top:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
select,input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-size:13px;font-family:inherit}
button{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-size:13px;font-family:inherit;cursor:pointer}
button:hover{background:var(--bg)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#0c447c}
button:disabled{opacity:.45;cursor:not-allowed}
.addr{margin-top:10px;padding:10px;background:var(--bg);border-radius:8px;font-size:11px;word-break:break-all;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
.tips{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.tips p{margin:0 0 8px}
.stage{position:relative;background:#eaeef2;border:1px solid var(--line);border-radius:12px;min-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.stage:fullscreen{background:#111;min-height:100vh;border:0;border-radius:0}
.stage:fullscreen canvas{max-width:100vw;max-height:100vh}
.placeholder{text-align:center;color:var(--muted);padding:24px}
.placeholder strong{display:block;color:var(--text);font-size:15px;font-weight:500;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:20px;margin-top:14px;padding:0 4px;flex-wrap:wrap}
.stat{font-size:12px;color:var(--muted)}
.stat b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.bar .spacer{margin-left:auto}
.error{display:none;margin-top:14px;padding:12px 14px;border-radius:8px;background:#fcebeb;border:1px solid #f7c1c1;color:var(--red);font-size:13px}
@media(max-width:900px){main{grid-template-columns:1fr}.stage{min-height:360px}}
</style>
</head>
<body>
<header>
  <h1>稳投屏 · 电脑接收端</h1>
  <span class="badge" id="badge">正在连接服务</span>
</header>

<main>
  <section class="card">
    <h2>手机扫码连接</h2>
    <img class="qr" id="qr" alt="连接二维码">
    <div class="qr-hint">用安卓手机上的「稳投屏」App 扫描</div>

    <div class="field">
      <label for="ipSelect">电脑的局域网 IP（多网卡时手动选）</label>
      <select id="ipSelect"></select>
    </div>
    <div class="field">
      <label>房间号</label>
      <input id="room" readonly>
    </div>
    <div class="addr" id="addr">正在获取地址…</div>
    <div class="field"><button id="copyBtn">复制连接地址</button></div>

    <div class="tips">
      <p>· 手机和电脑必须连同一个 Wi-Fi。</p>
      <p>· Windows 首次运行若弹出防火墙提示，请勾选「专用网络」并允许访问。</p>
      <p>· 用 Chrome / Edge / 夸克浏览器打开本页面（需支持 WebCodecs）。</p>
      <p>· 手机浏览器打开二维码地址可自检局域网是否连通。</p>
    </div>
  </section>

  <section>
    <div class="stage" id="stage">
      <div class="placeholder" id="placeholder">
        <strong>等待手机画面</strong>
        扫码并在手机上点「开始投屏」，画面会出现在这里
      </div>
      <canvas id="screen" hidden></canvas>
    </div>
    <div class="error" id="error"></div>
    <div class="bar">
      <span class="stat">分辨率 <b id="res">—</b></span>
      <span class="stat">帧率 <b id="fps">—</b></span>
      <span class="stat">码率 <b id="kbps">—</b></span>
      <span class="stat">解码 <b id="decode">—</b></span>
      <span class="spacer"></span>
      <button class="primary" id="fullBtn">全屏显示</button>
    </div>
  </section>
</main>

<script>
'use strict';

const $ = id => document.getElementById(id);
const badge = $('badge'), qrImg = $('qr'), ipSelect = $('ipSelect');
const canvas = $('screen'), ctx = canvas.getContext('2d', { alpha: false });
const placeholder = $('placeholder'), errorBox = $('error');

let ws = null, info = null, decoder = null, configKey = '';
let frameIndex = 0, activeConfig = null, reconnectTimer = null;
const stats = { frames: 0, bytes: 0, lastFrames: 0, lastBytes: 0, lastAt: performance.now() };

function setBadge(text, kind) {
  badge.textContent = text;
  badge.className = 'badge' + (kind ? ' ' + kind : '');
}
function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}
function clearError() {
  errorBox.style.display = 'none';
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function loadInfo(ip) {
  const url = '/api/info' + (ip ? '?ip=' + encodeURIComponent(ip) : '');
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('服务返回 ' + res.status);
  info = await res.json();
  qrImg.src = info.qr;
  $('room').value = info.room;
  $('addr').textContent = info.wsUrl;
  const addressKey = info.addresses.map(a => a.address).join(',');
  if (ipSelect.dataset.key !== addressKey) {
    ipSelect.innerHTML = '';
    for (const a of info.addresses) {
      const opt = document.createElement('option');
      opt.value = a.address;
      opt.textContent = a.address + '  (' + a.name + ')';
      ipSelect.appendChild(opt);
    }
    ipSelect.dataset.key = addressKey;
  }
  if (ip) ipSelect.value = ip;
  return info;
}

async function configureDecoder(cfg) {
  if (!('VideoDecoder' in window)) {
    showError('当前浏览器不支持 WebCodecs，请改用 Chrome / Edge / 夸克浏览器打开本页面。');
    setBadge('浏览器不支持', 'err');
    return;
  }
  const key = [cfg.codec, cfg.width, cfg.height, cfg.description].join('|');
  if (decoder && key === configKey) return;
  if (decoder) { try { decoder.close(); } catch {} decoder = null; }

  const config = {
    codec: cfg.codec,
    codedWidth: cfg.width,
    codedHeight: cfg.height,
    description: b64ToBytes(cfg.description),
    optimizeForLatency: true,
    hardwareAcceleration: 'prefer-hardware'
  };
  let support;
  try { support = await VideoDecoder.isConfigSupported(config); }
  catch (e) { showError('解码能力检查失败：' + e.message); return; }
  if (!support.supported) {
    showError('浏览器不支持该 H.264 配置：' + cfg.codec + ' ' + cfg.width + 'x' + cfg.height);
    return;
  }

  decoder = new VideoDecoder({
    output(frame) {
      if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
        canvas.width = frame.displayWidth;
        canvas.height = frame.displayHeight;
      }
      ctx.drawImage(frame, 0, 0);
      frame.close();
      stats.frames++;
      if (canvas.hidden) { canvas.hidden = false; placeholder.hidden = true; }
    },
    error(e) {
      console.error('解码错误', e);
      showError('解码出错：' + (e && e.message ? e.message : e));
    }
  });
  decoder.configure(config);
  configKey = key;
  activeConfig = cfg;
  frameIndex = 0;
  $('res').textContent = cfg.width + ' × ' + cfg.height;
  $('decode').textContent = 'WebCodecs 硬解';
  clearError();
}

function decodeFrame(buffer) {
  if (!decoder || decoder.state !== 'configured') return;
  const view = new Uint8Array(buffer);
  if (view.length < 2) return;
  const isKey = view[0] === 1;
  const data = view.slice(1);
  const fps = (activeConfig && activeConfig.fps) || 30;
  try {
    decoder.decode(new EncodedVideoChunk({
      type: isKey ? 'key' : 'delta',
      timestamp: Math.round(frameIndex * 1000000 / fps),
      data
    }));
    frameIndex++;
    stats.bytes += buffer.byteLength;
  } catch (e) {
    console.warn('送入解码失败', e);
  }
}

function onTextMessage(text) {
  let msg;
  try { msg = JSON.parse(text); } catch { return; }
  if (msg.type === 'status') {
    if (msg.senders > 0) {
      if (stats.frames === 0) { setBadge('手机已连接，等待画面', 'warn'); }
    } else {
      setBadge('等待手机扫码连接', '');
    }
  } else if (msg.type === 'config') {
    configureDecoder(msg);
    setBadge('投屏中', 'ok');
  }
}

function connect() {
  if (!info) return;
  clearTimeout(reconnectTimer);
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/ws?role=receiver&room=' + encodeURIComponent(info.room));
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    clearError();
    if (stats.frames === 0) setBadge('等待手机扫码连接', '');
  };
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') onTextMessage(ev.data);
    else if (ev.data instanceof ArrayBuffer) decodeFrame(ev.data);
  };
  ws.onclose = () => {
    setBadge('连接已断开，正在重连', 'warn');
    reconnectTimer = setTimeout(connect, 2000);
  };
  ws.onerror = () => { /* onclose 统一处理 */ };
}

function tick() {
  const now = performance.now();
  const dt = (now - stats.lastAt) / 1000;
  if (dt >= 1) {
    const df = stats.frames - stats.lastFrames;
    const db = stats.bytes - stats.lastBytes;
    $('fps').textContent = df > 0 ? (df / dt).toFixed(1) + ' fps' : '—';
    $('kbps').textContent = db > 0 ? Math.round(db * 8 / dt / 1000) + ' kbps' : '—';
    stats.lastFrames = stats.frames;
    stats.lastBytes = stats.bytes;
    stats.lastAt = now;
  }
  requestAnimationFrame(tick);
}

ipSelect.addEventListener('change', () => loadInfo(ipSelect.value).catch(showError));
$('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(info.wsUrl);
    $('copyBtn').textContent = '已复制';
    setTimeout(() => { $('copyBtn').textContent = '复制连接地址'; }, 1500);
  } catch {
    showError('复制失败，请手动选中上方地址复制。');
  }
});
$('fullBtn').addEventListener('click', () => {
  const stage = $('stage');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (stage.requestFullscreen) stage.requestFullscreen();
  else showError('当前浏览器不支持全屏 API。');
});

(async function init() {
  if (!('VideoDecoder' in window)) {
    showError('当前浏览器不支持 WebCodecs，请改用 Chrome / Edge / 夸克浏览器打开本页面。');
    setBadge('浏览器不支持', 'err');
  }
  try {
    await loadInfo();
    connect();
  } catch (e) {
    setBadge('服务未就绪', 'err');
    showError('无法获取连接信息：' + e.message + '。请确认 Node 服务已启动。');
  }
  tick();
})();
</script>
</body>
</html>
